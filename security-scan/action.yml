name: security-scan
description: >
  Standardized security scan composite action: CodeQL (SAST) + Trivy
  (config/fs/secret). Vendored by assurance-toolkit; reuse in the
  `security.yml` workflow of any monorepo.

inputs:
  languages:
    description: CodeQL languages (comma-separated), e.g. "typescript,javascript".
    required: true
  language-category:
    description: Primary CodeQL language for the analyze category.
    required: false
    default: typescript
  config-scan-ref:
    description: Path for Trivy config scan (Dockerfile / container config).
    required: false
    default: .
  iac-scan-ref:
    description: Path for Trivy fs/secret scan (terraform/k8s).
    required: false
    default: .
  dependency-scan-ref:
    description: Path for dependency scan (npm/composer/bun). Empty = skip.
    required: false
    default: ""
  sbom:
    description: Generate CycloneDX SBOM (advisory). true/false.
    required: false
    default: "false"
  dast-url:
    description: Target URL for OWASP ZAP baseline DAST (advisory). Empty = skip.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ inputs.languages }}
        queries: security-extended

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ inputs.language-category }}"

    - name: Trivy vulnerability scanner (config)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: config
        scan-ref: ${{ inputs.config-scan-ref }}
        format: table
        exit-code: "1"
        ignore-unfixed: true
        severity: CRITICAL,HIGH

    - name: Trivy Infrastructure as Code (fs/secret)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: ${{ inputs.iac-scan-ref }}
        scanners: misconfig,secret
        format: table
        exit-code: "1"
        severity: CRITICAL,HIGH

    - name: Dependency scan (npm audit)
      if: inputs.dependency-scan-ref != ''
      shell: bash
      run: |
        set -eo pipefail
        if [ -f "${{ inputs.dependency-scan-ref }}/package.json" ]; then
          cd "${{ inputs.dependency-scan-ref }}"
          npm audit --audit-level=high || echo "::warning::npm audit found high-severity vulnerabilities (advisory)"
        fi

    # --- Advisory scans (SBOM / DAST) — do not block the merge. ---
    - name: SBOM (CycloneDX, advisory)
      if: inputs.sbom == 'true'
      continue-on-error: true
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: cyclonedx-json

    - name: DAST (OWASP ZAP baseline, advisory)
      if: inputs.dast-url != ''
      continue-on-error: true
      uses: zaproxy/action-baseline@v0.15.0
      with:
        target: ${{ inputs.dast-url }}

branding:
  icon: shield
  color: red
